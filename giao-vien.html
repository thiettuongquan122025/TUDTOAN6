<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Toán Chẩn Đoán</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Serif:wght@400;600&family=Patrick+Hand&display=swap">
<style>
/* Bố cục: một tờ giấy ô li, thẻ trắng đặt trên giấy. Mực xanh cho thao tác của học sinh, bút đỏ cho điểm và lỗi sai.
   Chế độ tối là bảng xanh với phấn vàng. */
:root{
  --paper:#F2F5FB; --card:#FFFFFF; --grid:#DCE4F1; --line:#C8D2E6;
  --ink:#15203F; --ink2:#4B5878;
  --accent:#2A3FB8; --accent-ink:#FFFFFF; --accent-soft:#E6EAFB;
  --pen:#C62828; --pen-soft:#FBE6E6;
  --good:#1B7A4B; --good-soft:#E2F4EA;
  --warn:#9A6200; --warn-soft:#FFF1D6;
  --f-ui:'Be Vietnam Pro',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --f-math:'Noto Serif','Cambria','Times New Roman',serif;
  --f-hand:'Patrick Hand','Segoe Print','Bradley Hand',cursive;
  --f-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1F1B; --card:#172B26; --grid:#1D3630; --line:#2D4A42;
    --ink:#E9F1EC; --ink2:#A7BBB2;
    --accent:#F0D77A; --accent-ink:#1A2418; --accent-soft:#2B3A2A;
    --pen:#FF9C94; --pen-soft:#3A2323;
    --good:#7DD9A5; --good-soft:#1B3A2C;
    --warn:#F0C26B; --warn-soft:#3A3120;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1F1B; --card:#172B26; --grid:#1D3630; --line:#2D4A42;
  --ink:#E9F1EC; --ink2:#A7BBB2;
  --accent:#F0D77A; --accent-ink:#1A2418; --accent-soft:#2B3A2A;
  --pen:#FF9C94; --pen-soft:#3A2323;
  --good:#7DD9A5; --good-soft:#1B3A2C;
  --warn:#F0C26B; --warn-soft:#3A3120;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font:400 16px/1.55 var(--f-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
.wrap{max-width:780px;margin:0 auto;padding-block:8px 48px}
h1,h2,h3,p{margin:0}
h2{font:700 1.2rem/1.3 var(--f-ui);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 1rem/1.35 var(--f-ui)}
sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}.fr i{font-style:normal;padding:0 .2em}.fr i:first-child{border-bottom:1.5px solid currentColor}
/*@@FIGCSS-BEGIN@@*/
.fig{display:block;margin:10px 0;max-width:100%}
.fig svg{display:block;max-width:100%;height:auto;overflow:visible}
.fig .s{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.fig .f{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.fig .k{fill:var(--ink2);stroke:currentColor;stroke-width:1;opacity:.75}
.fig .d{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 3}
.fig .r{fill:none;stroke:var(--pen);stroke-width:1.8;stroke-linecap:round}
.fig .g{fill:none;stroke:var(--line);stroke-width:1}
.fig .dot{fill:currentColor;stroke:none}
.fig .hl{fill:var(--pen);stroke:none}
.fig text{fill:currentColor;font:600 13px var(--f-math);stroke:none}
.fig text.sm{font-size:11px;font-weight:500;fill:var(--ink2)}
.fig text.q{fill:var(--pen);font-weight:700}
table.dt{border-collapse:collapse;margin:10px 0;font:500 .95rem var(--f-ui);max-width:100%}
.dtw{max-width:100%;overflow-x:auto}
table.dt caption{caption-side:top;text-align:left;font-weight:600;padding-bottom:4px}
table.dt th,table.dt td{border:1.5px solid var(--line);padding:5px 8px;text-align:center}
table.dt th{background:var(--accent-soft)}
/*@@FIGCSS-END@@*/
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink2)} .small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

.brand{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.brand svg{flex:none}
.brand h1{font:700 1.3rem/1.15 var(--f-ui);letter-spacing:-.015em}
.brand small{display:block;font:400 .82rem/1.3 var(--f-ui);color:var(--ink2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.tint{background:var(--accent-soft);border-color:var(--accent)}
.card.alert{background:var(--warn-soft);border-color:var(--warn)}
.card.bad{background:var(--pen-soft);border-color:var(--pen)}

.btn{font:600 1rem/1 var(--f-ui);min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sec{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.pen{background:transparent;border-color:var(--pen);color:var(--pen)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:600 .85rem var(--f-ui);color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=password],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;min-height:48px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:110px;font-family:var(--f-mono);font-size:.78rem;line-height:1.4;resize:vertical}
input[type=text]#sid{font:600 1.15rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.hint{font-size:.85rem;color:var(--ink2)}
.err{font-size:.9rem;color:var(--pen);font-weight:600;min-height:1.3em}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:600 .95rem var(--f-ui);min-height:42px;padding:0 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.mode p{font-size:.92rem;color:var(--ink2)}
.tag{display:inline-block;font:600 .72rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

/* làm bài */
.qhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.timer{font-family:var(--f-mono);font-size:.95rem;color:var(--ink2)}
.prog{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.lvl{font:600 .75rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.qstem{font:400 1.3rem/1.55 var(--f-math);margin-block:8px 18px;text-wrap:pretty}
.opts{display:grid;gap:10px;border:0;padding:0;margin:0;min-width:0}
.opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:400 1.15rem/1.4 var(--f-math);position:relative;min-width:0;overflow-wrap:anywhere}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:600 .85rem var(--f-ui);color:var(--ink2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.opt.wrong .k{background:var(--pen);border-color:var(--pen);color:var(--card)}
.opt.locked{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.tfrow:first-of-type{border-top:0}
.tfrow .st{font:400 1.1rem/1.45 var(--f-math)}
.tfpair{display:flex;gap:8px}
.tfb{position:relative;display:grid;place-items:center;min-width:64px;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:600 .95rem var(--f-ui);color:var(--ink2)}
.tfb input{position:absolute;opacity:0;pointer-events:none}
.tfb:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.tfb.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tfb.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.tfb.wrong{border-color:var(--pen);background:var(--pen-soft);color:var(--ink)}
.tfb.locked{cursor:default}
@media (max-width:420px){.tfrow{grid-template-columns:1fr}.tfpair{justify-content:flex-start}}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:4px solid var(--good);background:var(--good-soft)}
.fb.no{border-left-color:var(--pen);background:var(--pen-soft)}
.fb b{display:block;margin-bottom:2px}
.fb .math{font-family:var(--f-math)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:36px;height:36px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);font:600 .8rem var(--f-ui);color:var(--ink2);cursor:pointer;padding:0}
.dot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--ink)}

/* kết quả */
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.score{font:400 4.2rem/1 var(--f-hand);color:var(--pen)}
.score span{display:inline-block;padding:6px 22px 8px;border:3px solid var(--pen);border-radius:52% 48% 50% 50% / 55% 50% 50% 45%;transform:rotate(-3deg)}
.score small{font-size:1.6rem}
.band{font:700 1.05rem var(--f-ui)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.orow .nm{font-weight:500;min-width:0}
.orow .pc{font:600 .9rem var(--f-mono);text-align:right}
.bar{grid-column:1/-1;height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.weak i{background:var(--pen)} .bar.pre i{background:var(--ink2);opacity:.6}
.bar.thin{height:7px}
.erritem{display:grid;gap:2px;padding-block:10px;border-top:1px dashed var(--line)}
.erritem:first-of-type{border-top:0}
.badge{display:inline-block;font:600 .75rem var(--f-ui);padding:2px 8px;border-radius:99px;background:var(--pen-soft);color:var(--pen);border:1px solid var(--pen)}
.badge.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.badge.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
details.rv{border-top:1px dashed var(--line);padding-block:8px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;font-weight:600;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .mk{flex:none;width:22px;text-align:center;font-weight:700}
.mk.ok{color:var(--good)} .mk.no{color:var(--pen)}
.rvbody{padding:8px 0 4px 32px;display:grid;gap:6px}
.rvbody .math{font-family:var(--f-math);font-size:1.05rem}
.code{font:500 .78rem/1.4 var(--f-mono)}

/* giáo viên */
.lvwarn{border:2px solid var(--pen);background:var(--pen-soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:500}
.lvnote{border:1px solid var(--warn);background:var(--warn-soft)}
.lvpill{position:fixed;right:12px;bottom:12px;z-index:20;font:600 .78rem var(--f-ui);padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lvpill.on{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.lvb{display:inline-block;font:600 .75rem var(--f-ui);padding:2px 8px;border-radius:6px;white-space:nowrap}
.lvb.ok{background:var(--good-soft);color:var(--good)}
.lvb.lo{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.lvb.md{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.lvb.hi{background:var(--pen-soft);color:var(--pen);border:1px solid var(--pen)}
.gdhelp{margin-top:6px}.gdhelp summary{cursor:pointer;font-weight:600;font-size:.85rem}.gdhelp ul{margin:6px 0 0 18px;display:grid;gap:4px}
.nocopy .qstem,.nocopy .opts,.nocopy .tfrow .st{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dlbox{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.dlbox.soon{border-color:var(--warn);background:var(--warn-soft)}
.dlbox.over{border-color:var(--pen);background:var(--pen-soft)}
.dlbox .dlh{font:700 1.05rem/1.3 var(--f-ui)}
.dlbox .dls{font-weight:600}
.dlbox .dlok{color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px}
.tile b{display:block;font:700 1.7rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--ink2)}
.hist{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:18px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.hist i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.hist i.p{background:var(--ink2);opacity:.55}
.hist em{font:600 .75rem var(--f-mono);font-style:normal;color:var(--ink2)}
.hist .x{font:500 .72rem var(--f-mono);color:var(--ink2);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}
.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);margin-right:6px;vertical-align:-1px;text-decoration:none}
.legend s.p{background:var(--ink2);opacity:.6}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th{font:600 .75rem var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
td.n{text-align:right;white-space:nowrap} th.n{text-align:right} td:first-child{white-space:nowrap}
.up{color:var(--good);font-weight:600} .dn{color:var(--pen);font-weight:600}
.steps{margin:0;padding-left:1.2em;display:grid;gap:6px}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink2);display:grid;gap:8px}
@media (min-width:760px){
  .wrap{padding-left:22px;box-shadow:inset 2px 0 0 var(--pen-soft)}
  .qstem{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="bank">
/* ============ NGÂN HÀNG CÂU HỎI THAM SỐ HÓA (Toán 6) ============ */
(function(root){
'use strict';

/* --- bộ sinh số ngẫu nhiên theo hạt giống: cùng hạt giống thì ra cùng đề --- */
function rngFrom(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const kit=rng=>({
  f:()=>rng(),
  i:(a,b)=>a+Math.floor(rng()*(b-a+1)),
  pick:a=>a[Math.floor(rng()*a.length)],
  shuf:a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=x[i];x[i]=x[j];x[j]=t}return x}
});

/* --- định dạng số: nhóm ba chữ số bằng dấu cách khi từ 5 chữ số trở lên --- */
const fmt=n=>{const s=String(n);return n>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,' '):s};
const F=n=>(Number.isInteger(n)&&n>=0)?fmt(n):null;
const sup=(a,b)=>a+'<sup>'+b+'</sup>';
const gcd=(a,b)=>b?gcd(b,a%b):a;
const Zs=n=>n<0?'−'+(-n):String(n);
const ZP=n=>n<0?'('+Zs(n)+')':String(n);
const fr=(a,b)=>'<span class="fr"><i>'+a+'</i><i>'+b+'</i></span>';
const frs=(a,b)=>(a<0?'−':'')+fr(Math.abs(a),b);
const dc=x=>String(Math.round(x*1e6)/1e6).replace('.',',');
const divisors=n=>{const d=[];for(let i=1;i<=n;i++) if(n%i===0) d.push(i);return d};
const lcm=(a,b)=>a/gcd(a,b)*b;
/*@@FIG-BEGIN@@*/
/* ===== Thư viện hình vẽ SVG và bảng cho câu hỏi ===== */
const FA=s=>String(s).replace(/<[^>]+>/g,'').replace(/"/g,"'").replace(/\s+/g,' ');
const FW=(alt,w,h,inner)=>'<span class="fig" role="img" aria-label="'+FA(alt)+'"><svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" focusable="false">'+inner+'</svg></span>';
const fT=(x,y,s,c,a)=>'<text x="'+Math.round(x*10)/10+'" y="'+Math.round(y*10)/10+'" text-anchor="'+(a||'middle')+'"'+(c?' class="'+c+'"':'')+'>'+s+'</text>';
const fLn=(x1,y1,x2,y2,c)=>'<line x1="'+Math.round(x1*10)/10+'" y1="'+Math.round(y1*10)/10+'" x2="'+Math.round(x2*10)/10+'" y2="'+Math.round(y2*10)/10+'" class="'+(c||'s')+'"/>';
const fPg=(p,c)=>'<polygon points="'+p.map(q=>(Math.round(q[0]*10)/10)+','+(Math.round(q[1]*10)/10)).join(' ')+'" class="'+(c||'s')+'"/>';
const fCi=(x,y,r,c)=>'<circle cx="'+Math.round(x*10)/10+'" cy="'+Math.round(y*10)/10+'" r="'+r+'" class="'+(c||'s')+'"/>';

/* --- dựng một câu: đáp án đúng cộng ba phương án nhiễu, mỗi phương án nhiễu gắn một mã lỗi --- */
function Q(stem,correct,wrongs,expl,fig){
  if(correct==null) throw new Error('correct');
  const seen=new Set([String(correct)]);const w=[],all=[];
  for(const x of wrongs){
    if(x[0]==null) continue;
    const s=String(x[0]);
    if(seen.has(s)) continue;
    seen.add(s);all.push({t:s,err:x[1]});
    if(w.length<3) w.push({t:s,ok:false,err:x[1]});
  }
  if(w.length<3) throw new Error('few');
  return {stem:stem+(fig||''),opts:[{t:String(correct),ok:true,err:null}].concat(w),expl:expl,wr:all};
}
function digitwise(a,b,f){
  const A=String(a).split('').reverse(),B=String(b).split('').reverse();
  const n=Math.max(A.length,B.length);let s='';
  for(let i=0;i<n;i++) s=String(f(+(A[i]||0),+(B[i]||0)))+s;
  return +s;
}

const fred=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;return [n/g,d/g]};

const feq=(a,b,c,d)=>a*d===b*c;
/* Q cho đáp số là phân số: loại các phương án bằng giá trị với đáp án */
function QF(stem,cn,cd,wr,expl,raw,fig){
  const w=wr.filter(x=>x[1]!==0&&!feq(x[0],x[1],cn,cd)).map(x=>[FRU(x[0],x[1]),x[2]]);
  return Q(stem,raw?FRU(cn,cd):FR(cn,cd),w,expl,fig);
}
const cop=(r,d,mx)=>{const c=[];for(let i=1;i<=mx;i++) if(gcd(i,d)===1) c.push(i);return r.pick(c)};
const chk=(...ps)=>{for(const p of ps){if(p[1]<=1||!coprime(p[0],p[1])) throw 0}};

const coprime=(a,b)=>gcd(Math.abs(a),Math.abs(b))===1;
const pairCo=(r,lo,hi)=>{for(let k=0;k<60;k++){const p=r.i(lo,hi),q=r.i(lo,hi);if(p!==q&&coprime(p,q)) return [p,q]}throw 0};

function genSafe(tpl,r){
  for(let k=0;k<80;k++){try{const q=tpl.gen(r);if(q) return q}catch(e){}}
  throw new Error('gen '+tpl.id);
}
function finalize(q,tpl,r){
  if(q.st) return {tid:tpl.id,out:tpl.out,lv:tpl.lv,bai:tpl.bai,kind:'tf',stem:q.stem,st:r.shuf(q.st),expl:q.expl};
  return {tid:tpl.id,out:tpl.out,lv:tpl.lv,bai:tpl.bai,stem:q.stem,opts:r.shuf(q.opts),expl:q.expl,wr:q.wr};
}
function poolOf(b,cfg,kind){
  const off=(cfg&&cfg.off)||[],bai=(cfg&&cfg.bai)||[],kd=kind||'mc';
  return TPL.filter(t=>(t.kind||'mc')===kd&&inCh(t,b)&&off.indexOf(t.id)<0&&(!bai.length||bai.indexOf(t.bai)>=0));
}
function testLen(b,cfg){
  const L=cfg&&cfg.bai?cfg.bai.length:0;
  if(!L) return CH[b].n;
  return cfg.n||(L===1?10:L===2?15:20);
}
const qkey=q=>q.stem+'|'+(q.st?q.st.map(o=>o.t).sort():q.opts.map(o=>o.t).sort()).join('|');
function testSeed(p,seed,cfg){return cfg&&cfg.fx?cfg.fx+(p==='post'?7919:0):seed}
/* đề giới hạn theo bài: chia đều số câu cho các bài thầy chọn */
function buildLessonTest(b,r,list,cfg){
  const ch=CH[b],ls=cfg.bai.filter(x=>ch.lessons[x]).sort((x,y)=>x-y),n=testLen(b,cfg),out=[],seen=new Set();
  const add=t=>{for(let k=0;k<8;k++){const c=finalize(genSafe(t,r),t,r),key=qkey(c);if(!seen.has(key)){seen.add(key);out.push(c);return true}}return false};
  ls.forEach((l,i)=>{
    const quota=Math.floor(n/ls.length)+(i<n%ls.length?1:0),pool=list.filter(t=>t.bai===l);
    let got=0,tries=0,bag=[];
    while(pool.length&&got<quota&&tries<quota*4){
      if(!bag.length) bag=r.shuf(pool);
      tries++;if(add(bag.shift())) got++;
    }
  });
  let tries=0,bag=[];
  while(out.length<n&&list.length&&tries<n*6){
    if(!bag.length) bag=r.shuf(list);
    tries++;add(bag.shift());
  }
  out.sort((x,y)=>x.bai-y.bai||LVORD[x.lv]-LVORD[y.lv]);
  return out;
}
function buildTest(b,seed,cfg){
  const r=kit(rngFrom(seed)),ch=CH[b],list=poolOf(b,cfg),pick=[];
  if(cfg&&cfg.mx) return buildMatrixTest(b,r,list,cfg);
  if(cfg&&cfg.bai&&cfg.bai.length) return buildLessonTest(b,r,list,cfg);
  ch.outs.forEach(o=>{
    const pool=list.filter(t=>t.out===o.id);if(!pool.length) return;let bag=[];
    for(let k=0;k<o.w;k++){if(!bag.length) bag=r.shuf(pool);pick.push(bag.shift())}
  });
  const qs=[],seen=new Set();
  pick.forEach(t=>{
    let q;for(let k=0;k<12;k++){q=finalize(genSafe(t,r),t,r);if(!seen.has(q.stem)) break}
    seen.add(q.stem);qs.push(q);
  });
  const oi={};ch.outs.forEach((o,i)=>oi[o.id]=i);
  qs.sort((x,y)=>oi[x.out]-oi[y.out]||LVORD[x.lv]-LVORD[y.lv]);
  return qs;
}
const tplErrCache={};
function tplErrs(t){
  if(tplErrCache[t.id]) return tplErrCache[t.id];
  const s=new Set();
  for(let k=0;k<14;k++){try{const q=t.gen(kit(rngFrom(9000+k*37)));(q.st||q.opts).forEach(o=>{if(o.err) s.add(o.err)})}catch(e){}}
  tplErrCache[t.id]=s;return s;
}
function buildPractice(b,seed,target,cfg){
  /* mỗi câu sai (hoặc bỏ trống) luyện lại đúng một câu cùng dạng, số liệu mới */
  if(target&&Array.isArray(target.w)){
    const r=kit(rngFrom(seed)),list=poolOf(b,cfg),seen=new Set(),out=[];
    target.w.forEach(w=>{
      let t=TPL.find(x=>x.id===w.t);
      if(!t){
        let c=list.filter(x=>x.bai===w.b&&x.lv===w.l);
        if(!c.length) c=list.filter(x=>x.bai===w.b);
        if(!c.length) c=list.filter(x=>x.lv===w.l);
        if(!c.length) c=list;
        t=c.length?r.pick(c):null;
      }
      if(!t) return;
      let q=null;
      for(let k=0;k<10;k++){q=finalize(genSafe(t,r),t,r);if(!seen.has(qkey(q))) break}
      seen.add(qkey(q));out.push(q);
    });
    return out;
  }
  const r=kit(rngFrom(seed)),list=poolOf(b,cfg),used=new Set(),chosen=[];
  const errs=(target&&target.errs)||[],outs=(target&&target.outs)||[];
  for(let round=0;round<2;round++){
    errs.forEach(e=>{
      if(chosen.length>=6) return;
      const c=r.shuf(list.filter(t=>!used.has(t.id)&&tplErrs(t).has(e)));
      if(c.length){chosen.push(c[0]);used.add(c[0].id)}
    });
  }
  outs.forEach(o=>{
    if(chosen.length>=8) return;
    const c=r.shuf(list.filter(t=>!used.has(t.id)&&t.out===o));
    if(c.length){chosen.push(c[0]);used.add(c[0].id)}
  });
  r.shuf(list.filter(t=>!used.has(t.id))).forEach(t=>{if(chosen.length<8){chosen.push(t);used.add(t.id)}});
  for(let k=0;chosen.length<8&&list.length&&k<16;k++) chosen.push(list[k%list.length]);
  return chosen.slice(0,8).map(t=>finalize(genSafe(t,r),t,r));
}
/* đề cố định: bài sau luyện tập là bản song song của bài đầu vào, cùng mẫu câu ở từng ô, chỉ đổi số liệu (so sánh trước và sau công bằng hơn) */
function shapeOf(q,weak){
  const st=String(q.stem).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]+>/g,'').replace(/\d+/g,'0').replace(/\b[A-Z]+\b/g,'P').replace(/\s+/g,' ');
  return weak?st:st+'|'+q.opts.map(o=>o.ok?'*':(o.err||'')).sort().join(',');
}
function buildPairedPost(b,cfg){
  const pre=buildTest(b,testSeed('pre',0,cfg),cfg);
  if(!pre.length||pre.some(q=>q.custom||(q.part&&q.part!=='mc')||q.st||!q.opts)) return null;
  const r=kit(rngFrom(testSeed('post',0,cfg))),seen=new Set(),out=[];
  for(const q of pre){
    const t=TPL.find(x=>x.id===q.tid);if(!t) return null;
    /* song song hoàn toàn: cùng mẫu câu, cùng dạng biểu thức/tình huống, cùng bộ lỗi sai ở các phương án; chỉ đổi số liệu */
    let nq=null,weak=null,ok=false;const sg=shapeOf(q),sw=shapeOf(q,1),pk=qkey(q);
    for(let k=0;k<1500&&!ok;k++){const c=finalize(genSafe(t,r),t,r);if(qkey(c)===pk||seen.has(qkey(c))) continue;if(!nq) nq=c;if(shapeOf(c,1)===sw){if(!weak) weak=c;if(shapeOf(c)===sg){nq=c;ok=true}}}
    if(!ok&&weak) nq=weak;
    if(!nq) nq=finalize(genSafe(t,r),t,r);
    seen.add(qkey(nq));out.push(nq);
  }
  ['warn','gaps','miss'].forEach(k=>{if(pre[k]!==undefined) out[k]=pre[k]});
  return out;
}
function buildQuiz(b,p,seed,target,cfg){
  if(p==='post'&&cfg&&cfg.fx){try{const q=buildPairedPost(b,cfg);if(q) return q}catch(e){}}
  return p==='prac'?buildPractice(b,seed,target,cfg):buildTest(b,testSeed(p,seed,cfg),cfg)}
function sample(tid,seed){const t=TPL.find(x=>x.id===tid),r=kit(rngFrom(seed));return finalize(genSafe(t,r),t,r)}

const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* chữ thầy gõ: ^ là số mũ, ví dụ 2^3, 2^{10}, a^(n+1) */
const mathH=s=>escH(s).replace(/\^\{([^}]{1,16})\}/g,'<sup>$1</sup>').replace(/\^\(([^)]{1,16})\)/g,'<sup>$1</sup>').replace(/\^([0-9]+|[a-zA-Z])/g,'<sup>$1</sup>');
const normKeep=s=>Array.from(String(s||'').normalize('NFC')).map(ch=>{const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return (b||' ')[0]}).join('').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\bky\b/g,'ki');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\bky\b/g,'ki');
function lvCounts(total,p){
  const sum=p.reduce((a,b)=>a+b,0)||1,raw=p.map(x=>total*x/sum),fl=raw.map(Math.floor);
  let rem=total-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).forEach(z=>{if(rem>0){fl[z[1]]++;rem--}});
  return fl;
}
function lvFromText(n){
  if(/\b(vdc|van dung cao)\b/.test(n)) return 'VDC';
  if(/\b(vd|van dung)\b/.test(n)) return 'VD';
  if(/\b(th|thong hieu|hieu)\b/.test(n)) return 'TH';
  if(/\b(nb|nhan biet|biet)\b/.test(n)) return 'NB';

function buildMatrixTest(b,r,list,cfg){

      expl:c.e?mathH(c.e):'Đáp án đúng là '+'ABCD'[c.a]+'.',custom:true});
  });

          for(const t of C){for(let k=0;k<8&&!done;k++){const q=tplGen(t,r,out.length),key=q&&qkey(q);if(q&&!seen.has(key)){seen.add(key);out.push(q);tu.set(t,(tu.get(t)||0)+1);done=true}}if(done) break}
          if(done){if(lv!==s.lv) warn.add('Ngân hàng chưa có mẫu mức '+LV[s.lv]+', đã thay bằng mức '+LV[lv]+'.');break}
        }

      miss++;warn.gaps.push({p:'mc',lv:s.lv,t:'none'});warn.add('Chưa đủ mẫu câu hỏi cho mức '+LV[s.lv]+'.');return}
    const tries=[];
    near(s.lv).forEach((lv,j)=>{
      if(j===0){tries.push([lv,s.bai]);tries.push([lv,s.any]);if(!rows) tries.push([lv,scope])}

    });

    return all;
  }
  out.warn=Array.from(warn);out.gaps=warn.gaps;out.miss=miss;

}

/* --- đọc bảng ma trận thầy dán từ Word/Excel --- */
function matchLessons(label){
  const n=norm(label);
  if(/\bbai\s*\d/.test(n)){
    const seg=n.slice(n.search(/\bbai\s*\d/));
    const L=lessonsIn(seg.replace(/[a-z]{4,}.*/,'')).filter(x=>LESSONS[x]);
    if(L.length) return L;
  }
  const cm=/\bchuong\s*(\d+|ix|iv|v?i{0,3})\b/.exec(n);
  if(cm&&cm[1]){
    const R={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9};const k=/^\d+$/.test(cm[1])?+cm[1]:R[cm[1]];
    const c=BOOK[k-1];if(c) return range(c.l[0],c.l[1]);
  }
  let best=0,bl=null;
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>2);
  Object.keys(LESSONS).forEach(k=>{
    const tn=norm(LESSONS[k]);
    let sc=0;
    if(n.indexOf(tn)>=0) sc=100;
    else{const tw=tn.split(/[^a-z0-9]+/).filter(w=>w.length>2);sc=tw.filter(w=>words.indexOf(w)>=0).length/Math.max(1,tw.length)*10}
    if(sc>best){best=sc;bl=[+k]}
  });
  return best>=5?bl:null;
}
function parseMatrixTable(text){
  const rows=[],bad=[];
  String(text||'').replace(/\r/g,'').split('\n').forEach(line=>{
    const raw=line.trim().normalize('NFC');if(!raw) return;
    const n=normKeep(raw);
    let label='',c=null;
    const kw=/\b(van dung cao|vdc|van dung|vd|thong hieu|th|nhan biet|nb|biet|hieu)\b\s*[:=]?\s*(\d+)/g;
    let m,first=-1;const k4=[0,0,0,0];
    while((m=kw.exec(n))){if(first<0) first=m.index;const lv=lvFromText(m[1]);k4[LV4.indexOf(lv)]+=+m[2]}
    if(first>=0){c=k4;label=raw.slice(0,first)}
    else{
      const cells=/[\t|;]/.test(raw)?raw.split(/[\t|;]/).map(x=>x.trim()).filter(x=>x!==''):raw.split(/\s+/);
      const nums=[];let i=cells.length-1;
      while(i>=0&&/^\d+$/.test(cells[i])){nums.unshift(+cells[i]);i--}
      if(nums.length<4) return;
      label=cells.slice(0,i+1).join(' ');
      let v=nums;
      if(v.length>=5&&v[v.length-1]===v.slice(-5,-1).reduce((a,b)=>a+b,0)) v=v.slice(0,-1);
      if(!label.trim()&&v.length===5){label='bài '+v[0];v=v.slice(1)}
      c=v.slice(-4);
    }
    if(!c.some(x=>x>0)) return;
    if(/^\s*(tong|cong|ti le|ty le|diem)\b/.test(normKeep(label).replace(/^[\s\d.]+/,''))) return;
    const L=matchLessons(label);
    if(!L){bad.push(label.trim()||raw);return}
    rows.push({label:label.replace(/[:|\t;,.\s]+$/,'').trim()||('Bài '+L.join(', ')),bai:L,c:c});
  });
  return {rows:rows,bad:bad,total:rows.reduce((a,w)=>a+w.c.reduce((x,y)=>x+y,0),0)};
}

function lvBack(){

  const q=S.quiz,auto=lvAdd(q,Math.max(0,Math.round((Date.now()-t0)/1000)),t0);

}

function saveDraft(){const q=S.quiz;if(!q) return;LS.set(K.draft,{sid:S.sid,b:q.b,p:q.p,seed:q.seed,target:q.target,cfg:q.cfg,ans:q.ans,i:q.i,start:q.start,lv:q.lv||null})}
function resumeDraft(){
  const lockedA=(a,qq)=>qq&&qq.kind==='tf'?isAns(a):(a!=null&&typeof a!=='object'&&a>=0);
  const d=LS.get(K.draft,null);if(!d||!CH[d.b]) return;

  S.fb={};if(d.p==='prac'){S.quiz.ans.forEach((a,i)=>{if(lockedA(a,S.quiz.qs[i])) S.fb[i]=true})}

function submit(){
  const q=S.quiz;if(q.cfg&&q.cfg.dl&&Date.now()>q.cfg.dl){S.confirm=false;S.xmsg='';render(true);return}
  const ev=D.evaluate(q.qs,q.ans);const sm=D.summarize(ev.items);

  if(q.lv&&gdMode(q.cfg)){e.lv={n:q.lv.n,s:q.lv.s,l:q.lv.l,a:q.lv.a?1:0,list:q.lv.list.slice(-20)}}

}

}

/* ---- danh sách lớp: chỉ lưu trên máy thầy ---- */
const normId=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'');
const vnorm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const ID_RE=/^[A-Z0-9][A-Z0-9_-]{1,11}$/,CLS_RE=/^\d{1,2}\s*[A-Za-z]\d{0,2}$/;
function roGet(){const r=LS.get(K.roster,[]);return Array.isArray(r)?r:[]}
function roMap(){const m={};roGet().forEach(r=>m[r.id]=r);return m}
function roClasses(){return Array.from(new Set(roGet().map(r=>r.cls||'(chưa ghi lớp)'))).sort()}
function parseRoster(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[],errs=[],seen={};let idx=null;
  lines.forEach((l,li)=>{
    let cells=/\t/.test(l)?l.split('\t'):/[|;]/.test(l)?l.split(/[|;]/):/,/.test(l)?l.split(','):null;
    if(cells) cells=cells.map(c=>c.trim());
    const n=vnorm(l);
    if(!idx&&/\bma\b/.test(n)&&/\bten\b/.test(n)&&cells&&cells.length>=2){
      idx={id:-1,name:-1,cls:-1};cells.forEach((c,i)=>{const v=vnorm(c);if(idx.id<0&&/\bma\b/.test(v)) idx.id=i;else if(idx.name<0&&/\bten\b/.test(v)) idx.name=i;else if(idx.cls<0&&/\blop\b/.test(v)) idx.cls=i});
      if(idx.id<0||idx.name<0) idx=null;return;
    }
    let id='',name='',cls='';
    if(idx&&cells){id=normId(cells[idx.id]);name=cells[idx.name]||'';cls=idx.cls>=0?(cells[idx.cls]||''):''}
    else{
      if(!cells){
        const tk=l.split(/\s+/);const k=tk.findIndex(t=>ID_RE.test(normId(t))&&normId(t)===t.toUpperCase()&&/[A-Z_-]/.test(normId(t)));
        if(k>=0){id=normId(tk[k]);const rest=tk.filter((t,j)=>j!==k&&!(j===0&&/^\d+$/.test(t)));if(rest.length&&CLS_RE.test(rest[rest.length-1])){cls=rest.pop()}name=rest.join(' ')}
      }else{
        const cand=cells.map((c,i)=>({c:c,i:i})).filter(z=>z.c!==''&&!(z.i===0&&/^\d+$/.test(z.c)&&cells.filter(Boolean).length>=3));
        const ic=cand.find(z=>ID_RE.test(normId(z.c))&&normId(z.c)===z.c.toUpperCase().replace(/\s/g,'')&&/[A-Z_-]/.test(normId(z.c)))||cand.find(z=>/^\d{2,12}$/.test(z.c));
        if(ic){id=normId(ic.c);const others=cand.filter(z=>z.i!==ic.i);const cz=others.find(z=>CLS_RE.test(z.c));if(cz) cls=cz.c;
          const nz=others.filter(z=>z!==cz).sort((x,y)=>y.c.length-x.c.length)[0];if(nz) name=nz.c}
      }
    }
    if(!ID_RE.test(id)){errs.push('Dòng '+(li+1)+': không thấy mã học sinh hợp lệ ('+l.slice(0,40)+').');return}
    cls=String(cls).replace(/\s+/g,'').toUpperCase();
    if(!cls){const m=/^(\d{1,2}[A-Z]\d{0,2})[-_]/.exec(id)||/^(\d{1,2}[A-Z]\d{0,2}?)\d{2}$/.exec(id);if(m) cls=m[1]}
    if(seen[id]){errs.push('Mã '+id+' bị trùng (dòng '+seen[id]+' và dòng '+(li+1)+'), em giữ dòng đầu.');return}
    seen[id]=li+1;rows.push({id:id,name:String(name).slice(0,60),cls:cls});
  });
  return {rows:rows,errs:errs};
}
function rosterGaps(sids,expect){
  const R=roGet();if(!R.length) return null;
  const pool=expect&&expect.length?R.filter(r=>expect.indexOf(r.id)>=0):R;
  const set=new Set(sids),known=new Set(R.map(r=>r.id));
  return {miss:pool.filter(r=>!set.has(r.id)),odd:Array.from(set).filter(x=>!known.has(x)),total:pool.length};
}

    const by={};G.miss.forEach(r=>{(by[r.cls||'(chưa ghi lớp)']=by[r.cls||'(chưa ghi lớp)']||[]).push(r)});

function teachState(){return LS.get(K.teach,{demo:false,codes:[]})}
function analyze(entries,b){
  const E=entries.filter(e=>e.b===b&&e.p!=='exam'),by={};
  E.forEach(e=>{
    const s=by[e.sid]||(by[e.sid]={sid:e.sid,pre:null,post:null,prac:0,errs:{}});
    if(e.p==='prac'){s.prac++;return}
    if(!s[e.p]||e.t>s[e.p].t) s[e.p]=e;
  });
  const stu=Object.keys(by).map(k=>by[k]);
  const stat=ph=>{
    const L=stu.map(s=>s[ph]).filter(Boolean),oc={},er={};
    L.forEach(e=>e.items.forEach(x=>{
      if(!x.out) return;const o=oc[x.out]||(oc[x.out]=[0,0]);o[1]++;if(x.r===1) o[0]++;
    }));
    L.forEach(e=>{const seen={};e.items.forEach(x=>{if(x.r===0&&x.err){const z=er[x.err]||(er[x.err]={stu:0,n:0});z.n++;if(!seen[x.err]){z.stu++;seen[x.err]=1}}})});
    const avg=L.length?L.reduce((a,e)=>a+e.score,0)/L.length:null;
    const hist=Array(5).fill(0);L.forEach(e=>hist[Math.min(4,Math.floor(e.score/2))]++);
    return {L:L,oc:oc,er:er,avg:avg,hist:hist};
  };
  return {stu:stu,pre:stat('pre'),post:stat('post')};
}

function bankCfg(){
  const bk=S.bk,ch=CH[bk.b];

  if(!bk.mxOn) return {cfg:cfg,info:info};

  if(bk.mxMode==='tab'){
    const t=D.parseMatrixTable(bk.tab);info.tab=t;
    if(!t.rows.length&&!cq.qs.length) info.err='Thầy dán bảng ma trận vào ô bên dưới rồi bấm "Cập nhật đề".';
    cfg.mx={rows:t.rows.map(w=>({b:w.bai,c:w.c}))};

  const nk=k=>cq.qs.filter(q=>q.k===k).length,on={tl:bk.tlOn,tf:bk.dsOn,sa:bk.saOn},nm={tl:'tự luận',tf:'đúng sai',sa:'trả lời ngắn'},ph={tl:'Phần IV · Tự luận',tf:'Phần II · Đúng sai',sa:'Phần III · Trả lời ngắn'};

  const tnp=tnOf(bk);
  if((bk.tlOn||bk.dsOn||bk.saOn)&&tnp<0.5&&!info.err) info.err='Tổng điểm các phần II, III, IV đang là '+r2n(10-tnp)+', cần nhỏ hơn 10 để còn ít nhất 0,5 điểm cho phần I.';
  if(bk.tlOn){

  return {cfg:cfg,info:info};
}

      const t=info.tab;
      if(t&&t.rows.length) h+='<div class="tbl"><table><thead><tr><th>Dòng ma trận</th><th>Bài</th>'+D.LV4.map(k=>'<th class="n">'+k+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(w=>'<tr><td>'+esc(w.label)+'</td><td>'+esc(D.rangesText(w.bai))+'</td>'+w.c.map(x=>'<td class="n">'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="small">Em đọc được '+t.rows.length+' dòng, tổng '+t.total+' câu.</p>';
      if(t&&t.bad.length) h+='<p class="err">Chưa nhận ra bài của dòng: '+t.bad.map(esc).join('; ')+'. Thầy thêm "Bài số" vào đầu dòng, ví dụ "Bài 14. Phép cộng số nguyên".</p>';
    }
    const cq=info.cq;
    h+='<details'+(bk.cq.trim()?' open':'')+'><summary style="cursor:pointer;font-weight:600">Kho câu hỏi của thầy (không bắt buộc)'+(cq&&cq.qs.length?' · '+cq.qs.length+' câu':'')+'</summary><div class="stack" style="margin-top:8px">';
    h+='<p class="small muted">Thầy dán cả hệ thống câu hỏi vào đây. Máy tự đọc từng câu, nhận ra bài và mức độ (nếu thầy đã ghi nhãn như [Bài 14] [Thông hiểu] thì máy dùng nhãn của thầy), rồi chọn câu vào đề đúng ma trận và đúng tỉ lệ các mức. Mức nào kho chưa đủ câu thì máy tự sinh bù. Câu trắc nghiệm: đề bài, bốn dòng A. B. C. D., dòng "Đáp án: B". Câu tự luận: đề bài, dòng "Đáp số: ...", dòng "Hướng dẫn chấm: ..." và nhãn [Tự luận], có thể thêm [1 điểm]. Viết số mũ bằng dấu ^, ví dụ 2^3 hoặc 2^{10}.</p>';
    h+='<textarea id="mxcq" rows="9" style="font-family:var(--f-ui);font-size:.9rem" placeholder="Câu 1. Kết quả của phép tính (−3) + 5 là:\nA. −8\nB. 2\nC. −2\nD. 8\nĐáp án: B\n[Bài 14] [Nhận biết]">'+esc(bk.cq)+'</textarea>';
    if(cq&&(cq.qs.length||cq.errs.length)){
      h+='<p class="small">Em đọc được '+cq.qs.length+' câu'+(cq.qs.length?': '+D.LV4.map(k=>esc(D.LV[k])+' '+cq.qs.filter(q=>q.l===k).length).join(' · '):'')+'.</p>'+(cq.errs.length?'<p class="err">'+cq.errs.map(esc).join('<br>')+'</p>':'');

      if(pk) h+='<p class="small">Đề lấy '+pk.chosen.length+' câu từ kho'+(pk.unused.length?', còn '+pk.unused.length+' câu chưa dùng (ngoài phạm vi bài hoặc vượt tỉ lệ của mức đó)':'')+'. Ô còn thiếu: em sẽ hỏi ý Thầy trước khi tự sinh bù.</p>';
      if(cq.qs.length){
        const au=cq.qs.filter(q=>q.auL||q.auB).length;

          const used=pk?pk.chosen.indexOf(q)>=0:true;
          return '<tr><td>'+(i+1)+(q.k==='tl'?' (TL)':'')+'</td><td>'+esc(q.s.length>70?q.s.slice(0,70)+'…':q.s)+'</td><td>'+(q.b?q.b+(q.auB?' (đoán)':''):'chưa rõ')+'</td><td>'+esc(D.LV[q.l])+(q.auL?' (đoán)':'')+'</td><td>'+(used?'có':'không')+'</td></tr>'}).join('')+'</tbody></table></div><p class="small muted">Chỗ máy đoán chưa đúng, thầy thêm nhãn vào cuối câu, ví dụ [Bài 9] [Vận dụng], máy sẽ theo nhãn của thầy.</p></details>';
      }
    }
    h+='</div></details>';
    if(info.note) h+='<p class="small" style="color:var(--warn)">'+esc(info.note)+'</p>';
    h+='<div class="field"><span class="lbl">Cách dùng đề</span><div class="seg"><button type="button" data-act="bk-pp" data-v="0" aria-pressed="'+(bk.pp?'false':'true')+'">Một bài kiểm tra</button><button type="button" data-act="bk-pp" data-v="1" aria-pressed="'+(bk.pp?'true':'false')+'">Lớp thử nghiệm: đầu vào, luyện lại, sau luyện tập</button></div><p class="small muted">'+(bk.pp?'Học sinh làm đề đầu vào, luyện lại theo lỗi sai, rồi làm đề sau luyện tập. Đề sau là bản song song: cùng mẫu câu ở từng ô, chỉ đổi số liệu. Đề cố định cho cả lớp và chỉ gồm câu trắc nghiệm. Dùng mã đề này để so sánh điểm trước và sau.':'Học sinh làm một bài kiểm tra theo ma trận.')+'</p></div><div class="row"><button class="btn" data-act="mx-apply">Cập nhật đề</button></div><p class="err" role="status">'+esc(info.err)+'</p></section>';

  if(noBank.length&&!bk.mxOn) h+='<div class="card alert small">Bài '+esc(D.rangesText(noBank))+' chưa có ngân hàng câu hỏi tự sinh. Thầy chuyển sang "Theo ma trận mức độ" và dán câu tự soạn cho các bài này.</div>';

  else h+=listHtml;

  if(bk.mxOn){
    let qs=[];if(!info.err) qs=D.buildQuiz(cfg.b,'exam',bk.vs*101,null,cfg);

    const qsM=qs.filter(q=>(q.kind||'mc')==='mc'),PL=[['mc','Phần I · Nhiều lựa chọn'],['tf','Phần II · Đúng sai'],['sa','Phần III · Trả lời ngắn'],['tl','Phần IV · Tự luận']],multi=qs.some(q=>q.kind);

      h+='<b>Cấu trúc đề</b><div class="tbl"><table><thead><tr><th>Phần</th><th class="n">Số câu</th><th class="n">Điểm</th>'+D.LV4.map(k=>'<th class="n">'+k+'</th>').join('')+'</tr></thead><tbody>'+PL.map(z=>{const g=qs.filter(q=>(q.kind||'mc')===z[0]);if(!g.length) return '';return '<tr><td>'+z[1]+'</td><td class="n">'+g.length+'</td><td class="n">'+dec(r2n(g.reduce((a,q)=>a+q.pt,0)))+'</td>'+D.LV4.map(k=>'<td class="n">'+(g.filter(q=>q.lv===k).length||'')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>';

    h+='<b>'+(multi?'Ma trận phần I · nhiều lựa chọn ('+qsM.length+' câu, '+dec(r2n(qsM.reduce((a,q)=>a+q.pt,0)))+' điểm)':'Ma trận thực tế của đề')+'</b>'+mxTable(qsM,bk.mxMode==='pct'?D.lvCounts(bk.total,bk.p):(info.tab?D.LV4.map((k,i)=>info.tab.rows.reduce((a,w)=>a+w.c[i],0)):null));

    h+='<details><summary style="cursor:pointer;font-weight:600">'+esc(cfg.t)+' ('+qs.length+' câu, có đáp án)</summary><div class="stack" style="margin-top:10px">'+qs.map((q,k)=>qBlock(q,k)).join('')+'</div></details></section>';

    const gate=hasKho&&(gaps.length||nErr)&&bk.okSig!==sig;
    if(gate){
      const PN={mc:'Phần I',tf:'Phần II',sa:'Phần III',tl:'Phần IV'},grp={};

      const nNone=gaps.filter(g=>g.t==='none').length,au=info.pick?info.pick.chosen.filter(q=>q.auL||q.auB).length:0;
      h+='<section class="card alert stack"><h3>Cần Thầy xác nhận trước khi tạo mã đề</h3><p class="small">Đề ưu tiên lấy câu trong kho của Thầy. Em phát hiện chỗ chưa khớp:</p><ul class="small" style="margin:0 0 0 18px;padding:0">'+li+(nErr?'<li>Kho có '+nErr+' câu em không đọc được nên bị bỏ qua (xem mục Kho câu hỏi ở trên).</li>':'')+(au?'<li>'+au+' câu trong đề do máy tự đoán bài hoặc mức. Thầy kiểm tra bảng "Xem máy phân loại từng câu".</li>':'')+'</ul><div class="row">'+(nNone?(bk.relax?'':'<button class="btn" data-act="gap-relax">Cho phép thay bằng mức gần nhất</button>'):'<button class="btn" data-act="gap-ok" data-sig="'+esc(sig)+'">Đồng ý, máy tự sinh bù</button>')+(nNone&&bk.relax?'<button class="btn" data-act="gap-ok" data-sig="'+esc(sig)+'">Đồng ý với đề như trên</button>':'')+'</div><p class="small muted">Thầy cũng có thể bổ sung câu vào kho hoặc chỉnh ma trận rồi bấm "Cập nhật đề". Chưa xác nhận thì em chưa phát mã đề.</p></section>';
      return h+'</div>';
    }
    const code=examCode(cfg);regExam(code);
    h+='<section class="card stack"><h3>Mã đề gửi học sinh</h3>'+dlField()+gdField()+roPick()+'<p class="small muted">Học sinh dán mã này vào ô "Mã đề của thầy" ở trang chủ rồi bấm "Làm bài".'+(cfg.cq.length?' Mã có chứa '+cfg.cq.length+' câu thầy tự soạn nên dài hơn bình thường, thầy gửi nguyên văn qua Zalo.':'')+'</p><textarea id="examcode" readonly rows="3" aria-label="Mã đề">'+esc(code)+'</textarea>'+lkBox(code)+'<div class="row"><button class="btn" data-act="bk-copy">Sao chép mã đề</button><span class="small muted" id="bmsg"></span></div></section>';
    return h+'</div>';
  }
  const okExam=sc?(emptyL.length===0&&shownL.length>0):enabled>=6;
  if(!okExam){
    h+='<p class="err">'+(sc?(shownL.length?'Bài '+emptyL.join(', ')+' chưa còn dạng câu nào được dùng. Thầy tích "Dùng" ít nhất một dạng câu cho mỗi bài đã chọn.':'Các bài đã chọn chưa có ngân hàng câu hỏi tự sinh.'):'Cần giữ ít nhất 6 dạng câu trong phạm vi này để ra đề.')+'</p></section>';

    else h+='<p class="small muted">Mỗi học sinh nhận số liệu khác nhau từ các dạng câu đã duyệt. Bên dưới là một đề mẫu để Thầy hình dung.</p><div class="row"><button class="btn sec sm" data-act="bk-more">Xem đề mẫu khác</button></div>';
    [['pre','Đề đầu vào'],['post','Đề sau luyện tập']].forEach((x,i)=>{
      const qs=D.buildQuiz(cfg.b,x[0],bk.vs*101+i,null,cfg);
      h+='<details><summary style="cursor:pointer;font-weight:600">'+x[1]+(sc?' · '+esc(baiText(bk.bai,bk.b)):'')+' ('+qs.length+' câu, có đáp án)</summary><div class="stack" style="margin-top:10px">'+qs.map((q,k)=>qBlock(q,k)).join('')+'</div></details>';
    });
    h+='</section>';
    const code=examCode(cfg);regExam(code);
    h+='<section class="card stack"><h3>Mã đề gửi học sinh</h3>'+dlField()+gdField()+roPick()+'<p class="small muted">Học sinh dán mã này vào ô "Mã đề của thầy" ở trang chủ. Chỉ các dạng câu thầy đã duyệt'+(sc?', thuộc '+esc(baiText(bk.bai,bk.b)):'')+' mới xuất hiện'+(bk.fixed?', và cả lớp làm cùng một đề':'')+'.</p><textarea id="examcode" readonly rows="3" aria-label="Mã đề">'+esc(code)+'</textarea>'+lkBox(code)+'<div class="row"><button class="btn" data-act="bk-copy">Sao chép mã đề</button><span class="small muted" id="bmsg"></span></div></section>';
  }
  return h+'</div>';

/* ===== bài học bất kì, môn học bất kì: máy lập lời nhắc cho công cụ AI của thầy, rồi kiểm tra và đóng gói câu hỏi thành đề ===== */
function gnCounts(g){const n=Math.max(4,Math.min(20,g.n|0||10));const sum=g.p.reduce((x,y)=>x+y,0);return {n:n,sum:sum,c:sum===100?D.lvCountsMin(n,g.p):null}}
function gnPrompt(g){
  const KC=gnCounts(g),c=KC.c||D.lvCountsMin(KC.n,[40,30,20,10]);
  const lv=['Nhận biết (biết): nhớ, nhận ra khái niệm, định nghĩa, kí hiệu, sự kiện trực tiếp trong bài','Thông hiểu (hiểu): giải thích, so sánh, phân biệt, diễn đạt lại bằng lời của mình, áp dụng một bước','Vận dụng: dùng kiến thức bài học để giải quyết tình huống, bài toán hoặc bài tập quen thuộc nhiều bước','Vận dụng cao: tình huống mới hoặc liên hệ thực tế, tổng hợp nhiều đơn vị kiến thức, cần suy luận sâu'];
  let t='Bạn là giáo viên giàu kinh nghiệm, đang soạn đề kiểm tra theo định hướng đánh giá năng lực của chương trình giáo dục phổ thông Việt Nam.\n\n';
  t+='THÔNG TIN BÀI HỌC\n- Môn học: '+(g.subj.trim()||'[chưa nhập]')+'\n- Lớp: '+(g.grade.trim()||'[chưa nhập]')+'\n- Bài học: '+(g.lesson.trim()||'[chưa nhập]')+'\n';
  if(g.content.trim()) t+='- Nội dung và yêu cầu cần đạt của bài (chỉ ra đề trong phạm vi này):\n'+g.content.trim()+'\n';
  t+='\nYÊU CẦU\nSoạn đúng '+KC.n+' câu hỏi trắc nghiệm một lựa chọn đúng, gồm:\n';
  ['NB','TH','VD','VDC'].forEach((k,i)=>{t+='- '+c[i]+' câu mức '+k+': '+lv[i]+'.\n'});
  t+='\nQUY TẮC NỘI DUNG\n- Mỗi câu có đúng 4 phương án A, B, C, D; chỉ một phương án đúng; vị trí đáp án đúng phân bố đều.\n- Phương án nhiễu phải hợp lí, phản ánh lỗi sai hoặc hiểu nhầm phổ biến của học sinh.\n- Chính xác về kiến thức, không mơ hồ, không có hai đáp án cùng đúng, không dùng "tất cả đều đúng" hay "không có đáp án nào đúng".\n- Câu mức Vận dụng và Vận dụng cao đặt trong tình huống cụ thể, không chỉ hỏi lại định nghĩa.\n- Chỉ dùng kí hiệu có thể gõ bằng bàn phím; số mũ viết dạng a^2, a^{n+1}; phân số viết a/b.\n- Mỗi câu kèm lời giải thích ngắn (1 đến 2 câu) vì sao đáp án đúng.\n';
  t+='\nĐỊNH DẠNG ĐẦU RA (bắt buộc đúng từng dòng, không thêm lời dẫn, không dùng bảng, không dùng in đậm)\nCâu 1. [NB] Nội dung câu hỏi?\nA. Phương án A\nB. Phương án B\nC. Phương án C\nD. Phương án D\nĐáp án: B\nGiải thích: Lí do ngắn gọn.\n\nCâu 2. [TH] ...\n(Nhãn mức đặt ngay sau "Câu n." là một trong: [NB], [TH], [VD], [VDC]. Sắp xếp các câu theo thứ tự mức độ tăng dần.)\n';
  return t;
}
function gnRead(){
  const g=S.gn,v=id=>{const e=document.getElementById(id);return e?e.value:null};let x;
  if((x=v('gn-subj'))!=null) g.subj=x.slice(0,80);
  if((x=v('gn-grade'))!=null) g.grade=x.slice(0,40);
  if((x=v('gn-lesson'))!=null) g.lesson=x.slice(0,160);
  if((x=v('gn-content'))!=null) g.content=x.slice(0,6000);
  if((x=v('gn-n'))!=null) g.n=Math.max(4,Math.min(20,parseInt(x,10)||10));
  for(let i=0;i<4;i++) if((x=v('gn-p'+i))!=null) g.p[i]=Math.max(0,Math.min(100,parseInt(x,10)||0));
  if((x=v('gn-paste'))!=null) g.paste=x.slice(0,60000);
  if((x=v('gn-title'))!=null) g.title=x.slice(0,80);
  LS.set(K.gn,g);
}
function gnParse(g){
  const r=D.parseCustom(g.paste);
  const qs=r.qs.filter(q=>!q.k);qs.forEach(q=>{q.b=0});
  return {qs:qs,errs:r.errs,skipped:r.qs.length-qs.length,auto:qs.filter(q=>q.auL).length};
}
function gnCfg(g,qs){
  const KC=gnCounts(g);
  const cfg={b:'6.1',off:[],fx:0,bai:[],n:0,mx:{t:KC.n,p:g.p.slice()},co:true,sx:true,cq:[]};
  cfg.t=(g.title.trim()||('Kiểm tra '+(g.subj.trim()?g.subj.trim()+' · ':'')+(g.lesson.trim()||'bài học'))).slice(0,80);
  const pk=D.pickCustom(cfg,qs,(g.seed||1)*101);cfg.cq=pk.chosen;
  return {cfg:cfg,pick:pk};
}

async function gnAct(a,el){

}

  t+='- "lv": "NB" | "TH" | "VD" | "VDC".\n- "vars": các biến. Biến số nguyên: "a":[nhỏ nhất, lớn nhất]. Danh sách số: "k":{"list":[2,3,5,7]}. Biến chữ để đổi tình huống: "w":{"text":["quyển vở","cái bút"]}.\n- "let": (không bắt buộc) biến tính từ biến trước đó, theo thứ tự khai báo, ví dụ "let":{"c":"a*b"}.\n- "where": (không bắt buộc) điều kiện loại tổ hợp số không dùng được, ví dụ "a!=b" hoặc ["a<b","c>0"].\n- "stem": đề bài; chỗ cần điền số hoặc biểu thức thì viết trong ngoặc nhọn, ví dụ "Tính {a} + {b}".\n- "ans": đáp án đúng, cũng viết dạng "{biểu thức}" hoặc chữ có chèn {biểu thức}.\n- "chk": (rất nên có) một CÁCH TÍNH KHÁC cho cùng đáp án để máy tự đối chiếu và phát hiện công thức sai.\n- "wrong": 3 đến 5 phương án nhiễu, mỗi phần tử {"t":"{biểu thức}","e":"lỗi sai học sinh mắc phải khi chọn phương án này"}. Phương án nhiễu phải đến từ lỗi sai có thật (sai dấu, sai quy tắc, nhầm công thức, quên bước...), tuyệt đối không trùng đáp án đúng.\n- "expl": lời giải ngắn, có chèn {biểu thức}.\n';

  t+='\nVÍ DỤ ĐÚNG ĐỊNH DẠNG (chỉ để minh họa cú pháp, không soạn lại các mẫu này):\n'+JSON.stringify(TP_EX,null,1)+'\n';

}
function tpRead(){
  const g=S.tp,v=id=>{const e=document.getElementById(id);return e?e.value:null};let x;
  if((x=v('tp-grade'))!=null) g.grade=x.slice(0,40);
  if((x=v('tp-lesson'))!=null) g.lesson=x.slice(0,160);
  if((x=v('tp-content'))!=null) g.content=x.slice(0,6000);
  for(let i=0;i<4;i++) if((x=v('tp-k'+i))!=null) g.k[i]=Math.max(0,Math.min(8,parseInt(x,10)||0));
  if((x=v('tp-paste'))!=null) g.paste=x.slice(0,200000);
  if((x=v('tp-n'))!=null) g.n=Math.max(4,Math.min(20,parseInt(x,10)||10));
  for(let i=0;i<4;i++) if((x=v('tp-p'+i))!=null) g.p[i]=Math.max(0,Math.min(100,parseInt(x,10)||0));
  if((x=v('tp-title'))!=null) g.title=x.slice(0,80);
  LS.set(K.tp,g);
}
function tpParse(txt){
  let t=String(txt||'').trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'');
  const i=t.search(/[\[{]/);if(i<0) return {err:'Chưa thấy dữ liệu JSON. Thầy dán nguyên phần AI trả về.'};
  t=t.slice(i);const j=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));if(j>0) t=t.slice(0,j+1);
  let arr;try{arr=JSON.parse(t)}catch(e){return {err:'JSON bị lỗi cú pháp: '+e.message+'. Thầy nhờ AI "xuất lại đúng JSON hợp lệ, không bọc ```".'}}
  if(!Array.isArray(arr)) arr=arr&&Array.isArray(arr.templates)?arr.templates:[arr];
  return {items:arr.slice(0,40)};
}
function tpEval(g){
  if(!g.paste.trim()) return null;
  const P=tpParse(g.paste);if(P.err) return {err:P.err};
  return {rows:P.items.map((raw,i)=>{
    const N=D.tplNorm(raw);if(N.err) return {i:i,st:'bad',msg:N.err,lv:raw&&raw.lv};
    const c=D.tplCheck(N.t);let st='ok',msg='';
    if(c.err){st='bad';msg=c.err}
    else if(c.chk>0){st='bad';msg='Công thức đáp án không khớp công thức kiểm tra ("chk") ở '+c.chk+'/'+c.n+' lần thử, nhiều khả năng đáp án sai.'}
    else if(c.rate<0.1||c.distinct<3){st='bad';msg='Hầu như không sinh được câu hợp lệ (tỉ lệ '+Math.round(c.rate*100)+'%, '+c.distinct+' biến thể). Điều kiện "where" quá chặt hoặc phương án nhiễu hay trùng nhau.'}
    else if(c.distinct<30||c.rate<0.3){st='warn';msg='Dùng được nhưng ít biến thể ('+c.distinct+') hoặc tỉ lệ sinh thấp ('+Math.round(c.rate*100)+'%).'}
    return {i:i,st:st,msg:msg,t:N.t,c:c,lv:N.t.lv};
  })};
}

function finalOf(e,G){

}

function examStats(all){
  const ex=all.filter(e=>e.p==='exam');if(!ex.length) return null;
  const ks=Array.from(new Set(ex.map(e=>e.k||'-')));const k=ks.indexOf(S.xf)>=0?S.xf:ks[0];
  const by={};ex.filter(e=>(e.k||'-')===k).forEach(e=>{if(!by[e.sid]||e.t>by[e.sid].t) by[e.sid]=e});
  const L=Object.keys(by).map(s=>by[s]).sort((x,y)=>x.score-y.score||(x.sid<y.sid?-1:1));
  const lv={},bai={},er={};
  L.forEach(e=>{const seen={};e.items.forEach(x=>{if(x.kind==='tl') return;const z=itemLv(x);
    if(z[0]){const o=lv[z[0]]||(lv[z[0]]=[0,0]);o[1]++;if(x.r===1) o[0]++}
    if(z[1]){const o=bai[z[1]]||(bai[z[1]]=[0,0]);o[1]++;if(x.r===1) o[0]++}
    if(x.r===0&&x.err&&x.err!=='E_CUSTOM'&&x.err!=='E_TPL'){const q=er[x.err]||(er[x.err]={stu:0,n:0});q.n++;if(!seen[x.err]){q.stu++;seen[x.err]=1}}})});
  const G=LS.get(K.grade,{}),fin=L.map(e=>finalOf(e,G));
  const avg=fin.reduce((a,f)=>a+f.tot,0)/L.length;
  return {ks:ks,k:k,L:L,lv:lv,bai:bai,er:er,avg:avg,pass:fin.filter(f=>f.tot>=5).length,fin:fin,hasTl:fin.some(f=>f.tl),pend:fin.filter(f=>f.tl&&!f.full).length};
}

function demoCodes(){
  const rr=D.kit(D.rngFrom(20261016)),out=[],now=Math.floor(Date.now()/1000);
  for(let i=1;i<=24;i++){
    const sid='6A-'+pad(i),theta=0.38+rr.f()*0.42;
    ['pre','prac','post'].forEach((ph,pi)=>{
      if(ph==='prac'&&rr.f()<0.4) return;
      const seed=rr.i(1,2e9),target=ph==='prac'?{errs:['E_POWMUL','E_ORDER','E_CARRY'],outs:['S5','S6']}:null,qs=D.buildQuiz('6.1',ph,seed,target);
      const ans=qs.map(q=>{
        const weak=(q.out==='S5'||q.out==='S6')?-0.18:0,gain=ph==='post'?0.14+((q.out==='S5'||q.out==='S6')?0.14:0):0;
        const p=Math.min(0.96,Math.max(0.08,theta+weak+gain+(q.lv==='VD'?-0.12:q.lv==='NB'?0.1:0)));
        if(rr.f()<p) return q.opts.findIndex(o=>o.ok);
        const w=q.opts.map((o,k)=>k).filter(k=>!q.opts[k].ok);return rr.pick(w);
      });
      const ev=D.evaluate(qs,ans);
      const e={b:'6.1',p:ph,sid:sid,t:now-(3-pi)*86400*3,d:rr.i(600,1500),items:ev.items};
      out.push(D.makeCode(e));
    });
  }
  return out;
}
function tsvTable(){
  const ts=teachState();const all=D.parseCodes(ts.codes.join('\n')).ok;const bs=Array.from(new Set(all.map(e=>e.b)));const b=bs.indexOf(S.tf)>=0?S.tf:(bs[0]||'6.1');
  const A=analyze(all,b);const RM=roMap();const L=['Mã học sinh\tHọ tên\tLớp\tĐiểm đầu vào\tĐiểm sau\tTăng\tSố lượt luyện tập\tLỗi nổi bật\tRời màn hình (lần)\tRời màn hình (giây)\tLần rời từ 3 giây\tTự nộp do rời màn hình'];
  A.stu.sort((x,y)=>x.sid<y.sid?-1:1).forEach(s=>{
    const g=s.pre&&s.post?s.post.score-s.pre.score:'';const src=s.pre||s.post;const er={};(src?src.items:[]).forEach(x=>{if(x.r===0&&x.err) er[x.err]=(er[x.err]||0)+1});
    const top=Object.keys(er).sort((x,y)=>er[y]-er[x]).slice(0,2).map(errName).join('; ');
    const f=v=>v===''||v==null?'':dec(v);
    L.push([s.sid,nmOf(RM,s.sid),RM[s.sid]?RM[s.sid].cls:'',s.pre?f(s.pre.score):'',s.post?f(s.post.score):'',g===''?'':f(g),s.prac,top].concat(lvTsv(lvSum([s.pre,s.post]))).join('\t'));
  });
  const have=new Set(A.stu.map(x=>x.sid));roGet().filter(r=>!have.has(r.id)).forEach(r=>L.push([r.id,r.name,r.cls,'chưa nộp','','','','','','','',''].join('\t')));
  return L.join('\n');
}

    if(!r) S.extMsg='Máy này chưa lưu mã đề này.';else if(!v) S.extMsg='Thầy chọn ngày giờ hạn mới.';else if(v<=(r.dl||0)) S.extMsg='Hạn mới phải muộn hơn hạn hiện tại ('+dlText(r.dl)+').';else if(v<=Date.now()) S.extMsg='Hạn mới phải muộn hơn thời điểm hiện tại.';
    else{r.dl=v;LS.set(K.exreg,reg);S.extOut={k:k,code:D.makeExtCode(k,v)};S.extMsg='Hạn mới: '+dlText(v)+'. Gửi mã này cho học sinh.'}
    render();return}
  if(a==='ext-copy'){const ok=await copyText(($('#ext-code')||{}).value||'');S.extMsg=ok?'Đã sao chép mã gia hạn.':'Thầy nhấn giữ vào ô mã, chọn tất cả rồi sao chép.';render();return}
  if(a==='lk-copy'){const b=(($('#lk-base')||{}).value||'').trim();const m0=!b||/^https?:\/\/\S+$/i.test(b);if(m0) LS.set(LKB,b);dlRead();render();const m=$('#lk-msg');
    if(!m0){if(m) m.textContent='Địa chỉ web phải bắt đầu bằng http:// hoặc https://.';return}
    const u=$('#lk-url');if(!u){if(m) m.textContent='Thầy dán địa chỉ web của app vào ô trên, rồi bấm lại.';return}
    const ok=await copyText(u.value);if(m) m.textContent=ok?'Đã sao chép liên kết. Thầy dán vào Zalo gửi học sinh.':'Thầy bấm vào ô liên kết, chọn tất cả rồi sao chép.';if(!ok){u.focus();u.select()}return}
  if(a==='useexam'){const c=D.parseExamCode($('#exam').value);if(!c){S.emsg='Mã đề chưa đúng. Em kiểm tra mã có đủ, không bị cắt giữa chừng.';render();return}S.cfg=c;S.b=c.b;S.emsg='';LS.set(K.exam,c);render();return}
  if(a==='dropexam'){S.cfg=null;LS.del(K.exam);render();return}
  if(a.indexOf('bk-')===0||a.indexOf('mx-')===0||a.indexOf('tl-')===0||a.indexOf('ro-')===0||a.indexOf('part-')===0) mxRead();
  if(a==='sa-check'&&S.quiz){const q=S.quiz;if(isAns(q.ans[q.i])){S.fb[q.i]=true;render()}return}
  if(a==='gap-ok'){S.bk.okSig=el.dataset.sig||'ok';LS.set(K.bk,S.bk);render();return}
  if(a==='gap-relax'){S.bk.relax=true;S.bk.okSig='';LS.set(K.bk,S.bk);render();return}
  if(a==='part-on'){const k=el.dataset.v+'On';S.bk[k]=!S.bk[k];S.bk.bk=null;LS.set(K.bk,S.bk);render();return}
  if(a==='part-std'){Object.assign(S.bk,{dsOn:true,saOn:true,dsN:4,dsPt:4,saN:6,saPt:3,total:12});S.bk.tnPt=tnOf(S.bk);LS.set(K.bk,S.bk);render();return}
  if(a==='bk-cmd'){
    const txt=($('#cmd')?$('#cmd').value:'');S.bk.cmd=txt;const r=D.parseCommand(txt);
    if(r.error){S.bk.cmsg=r.error}
    else{S.bk.b=r.b;S.bk.bai=r.bai;S.bk.n=r.n;S.bk.open='';S.bk.cmsg='';S.bk.vs++;
      if(r.mx){S.bk.mxOn=true;S.bk.mxMode='pct';S.bk.total=r.mx.t;S.bk.p=r.mx.p.slice();S.bk.title=r.title;S.bk.tlOn=!!r.tl;if(r.tl){S.bk.tlPt=r.tl.pt;S.bk.tlN=r.tl.n;S.bk.tlP=r.tl.p.slice()}S.bk.dsOn=!!r.ds;if(r.ds){S.bk.dsPt=r.ds.pt;S.bk.dsN=r.ds.n}S.bk.saOn=!!r.sa;if(r.sa){S.bk.saPt=r.sa.pt;S.bk.saN=r.sa.n}S.bk.tnPt=tnOf(S.bk)}else S.bk.mxOn=false}
    LS.set(K.bk,S.bk);render();return}
  if(a==='ro-save'){const r=parseRoster(($('#roster')||{}).value||'');if(!r.rows.length){S.romsg='Chưa đọc được dòng nào. '+r.errs.slice(0,3).join(' ');render();return}
    LS.set(K.roster,r.rows);S.roclr=false;const cl={};r.rows.forEach(x=>{const c=x.cls||'(chưa ghi lớp)';cl[c]=(cl[c]||0)+1});
    S.romsg='Đã lưu '+r.rows.length+' em: '+Object.keys(cl).sort().map(c=>c+' ('+cl[c]+')').join(', ')+'.'+(r.errs.length?'\n'+r.errs.slice(0,8).join('\n')+(r.errs.length>8?'\n… và '+(r.errs.length-8)+' dòng khác.':''):'');
    S.bk.roCls=S.bk.roCls.filter(c=>cl[c]);LS.set(K.bk,S.bk);render();return}
  if(a==='ro-clear'){if(!S.roclr){S.roclr=true;render();return}LS.del(K.roster);S.roclr=false;S.romsg='Đã xóa danh sách lớp trên máy này.';S.bk.roCls=[];LS.set(K.bk,S.bk);render();return}
  if(a==='ro-copy'){const R=roGet();const ok=await copyText('Mã HS\tHọ và tên\tLớp\n'+R.map(r=>r.id+'\t'+r.name+'\t'+r.cls).join('\n'));S.romsg=ok?'Đã sao chép danh sách.':'Trình duyệt không cho sao chép tự động.';render();return}
  if(a==='ro-cls'){const v=el.dataset.v;if(!v) S.bk.roCls=[];else{const i=S.bk.roCls.indexOf(v);if(i>=0) S.bk.roCls.splice(i,1);else S.bk.roCls.push(v)}LS.set(K.bk,S.bk);render();return}
  if(a==='tl-on'){S.bk.tlOn=el.dataset.v==='1';LS.set(K.bk,S.bk);render();return}
  if(a==='grade'){S.view='grade';S.gs=0;S.gmsg='';render(true);return}
  if(a==='gr-q'){setGrade(+el.dataset.i,el.dataset.v===''?null:+el.dataset.v,+el.dataset.max);render();return}
  if(a==='gr-acceptall'){acceptAll();render();return}
  if(a==='gr-next'){S.gs++;render(true);return}
  if(a==='gr-prev'){S.gs=Math.max(0,S.gs-1);render(true);return}
  if(a==='gr-reg'){const c=D.parseExamCode(($('#regcode')||{}).value||'');if(!c){S.gmsg='Mã đề chưa đúng.';render();return}regExam(c.code);S.gmsg='';render();return}
  if(a==='copygrade'){const ok=await copyText(examTsv());S.gmsg=ok?'Đã sao chép bảng điểm. Thầy mở Excel và dán vào ô A1.':'Trình duyệt không cho sao chép tự động.';render();return}
  if(a==='mx-on'){S.bk.mxOn=el.dataset.v==='1';LS.set(K.bk,S.bk);render();return}
  if(a==='mx-mode'){S.bk.mxMode=el.dataset.v==='tab'?'tab':'pct';LS.set(K.bk,S.bk);render();return}
  if(a==='mx-preset'){const x=D.PRESETS.find(z=>z.id===el.dataset.v);if(x){S.bk.b='6.T';S.bk.bai=[];for(let i=x.l[0];i<=x.l[1];i++) S.bk.bai.push(i);S.bk.title=x.t;S.bk.mxOn=true;S.bk.vs++}LS.set(K.bk,S.bk);render();return}
  if(a==='bk-pp'){S.bk.pp=el.dataset.v==='1';if(S.bk.pp){S.bk.fixed=true;if(!S.bk.fx) S.bk.fx=newSeed()}S.bk.vs++;LS.set(K.bk,S.bk);render();return}
  if(a==='mx-apply'){S.bk.vs++;LS.set(K.bk,S.bk);render();return}
  if(a==='bk-chap'){const v=el.dataset.v.split('-').map(Number);const L=[];for(let i=v[0];i<=v[1];i++) L.push(i);const allIn=L.every(l=>S.bk.bai.indexOf(l)>=0);S.bk.bai=allIn?S.bk.bai.filter(l=>L.indexOf(l)<0):Array.from(new Set(S.bk.bai.concat(L))).sort((x,y)=>x-y);S.bk.n=0;LS.set(K.bk,S.bk);render();return}
  if(a==='copyexam'){const ok=await copyText(examTsv());S.tmsg=ok?'Đã sao chép bảng điểm bài kiểm tra. Thầy mở Excel và dán vào ô A1.':'Trình duyệt không cho sao chép tự động.';const m=$('.err[role=status]');if(m) m.textContent=S.tmsg;return}
  if(a==='bk-bai'){
    const v=+el.dataset.v;
    if(!v){S.bk.bai=[]}
    else{const i=S.bk.bai.indexOf(v);if(i>=0) S.bk.bai.splice(i,1);else S.bk.bai.push(v);S.bk.bai.sort((x,y)=>x-y)}
    S.bk.n=0;S.bk.cmsg='';LS.set(K.bk,S.bk);render();return}
  if(a==='bk-open'){S.bk.open=S.bk.open===el.dataset.tid?'':el.dataset.tid;LS.set(K.bk,S.bk);render();return}
  if(a==='bk-more'){S.bk.vs++;LS.set(K.bk,S.bk);render();return}
  if(a==='bk-mode'){S.bk.fixed=el.dataset.v==='1';if(S.bk.fixed&&!S.bk.fx) S.bk.fx=newSeed();LS.set(K.bk,S.bk);render();return}
  if(a==='bk-newseed'){S.bk.fx=newSeed();LS.set(K.bk,S.bk);render();return}
  if(a==='bk-copy'){dlRead();render();const ok=await copyText($('#examcode').value);$('#bmsg').textContent=ok?'Đã sao chép mã đề.':'Thầy nhấn giữ vào ô mã, chọn tất cả rồi sao chép.';return}
  if(a==='analyze'){
    const txt=$('#codes').value;const p=D.parseCodes(txt);const ts=teachState();
    if(!p.ok.length){S.tmsg=txt.trim()?'Không đọc được mã nào. Kiểm tra mã có đủ, không bị cắt giữa chừng.':'Thầy dán mã vào ô trên rồi bấm lại.';render();return}
    if(ts.demo){ts.codes=[];ts.demo=false}
    const have=new Set(ts.codes);let added=0;p.ok.forEach(e=>{if(!have.has(e.code)){ts.codes.push(e.code);added++}});
    LS.set(K.teach,ts);S.tmsg='Đã thêm '+added+' bài mới'+(p.ok.length-added?' ('+(p.ok.length-added)+' mã đã có trước đó)':'')+(p.bad.length?'. Có '+p.bad.length+' mã lỗi, không đọc được.':'.');render();return;
  }
  if(a==='demo'){LS.set(K.teach,{demo:true,codes:demoCodes()});S.tmsg='';render();return}
  if(a==='clear'){LS.set(K.teach,{demo:false,codes:[]});S.tmsg='Đã xóa dữ liệu.';render();return}
  if(a==='copytable'){const ok=await copyText(tsvTable());S.tmsg=ok?'Đã sao chép bảng. Thầy mở Excel và dán vào ô A1.':'Trình duyệt không cho sao chép tự động.';const m=$('.err[role=status]');if(m) m.textContent=S.tmsg;return}
});
function lastTarget(){
  const h=LS.get(K.hist,[]).filter(e=>e.sid===($('#sid')?$('#sid').value.toUpperCase().replace(/[^A-Z0-9_-]/g,''):S.sid)&&e.b===S.b);
  return h.length?weakTarget(h[0]):null;
}
function unlock(){
  const v=($('#pin')||{}).value||'';
  if(D.hash5('tcd:'+v)===PINH){S.tauth=true;S.pmsg='';render(true)}else{S.pmsg='Mã PIN chưa đúng.';render();const p=$('#pin');if(p) p.focus()}
}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target&&ev.target.id==='pin'){ev.preventDefault();unlock()}
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='cmd'){ev.preventDefault();const b=document.querySelector('[data-act=bk-cmd]');if(b) b.click()}});
render();
})();
</script>
</body></html>
